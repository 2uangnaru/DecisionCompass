name: decision_compass
description: AstraCue Cosmic Decisions vertical-slice mobile prototype.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  # Flutter's own localization delegates and gen_l10n runtime. Both ship with
  # the SDK, so no third-party or network translation service is involved.
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.6.0
  # Device IANA timezone id (not a DateTime.timeZoneName abbreviation).
  flutter_timezone: ^5.1.0
  # Foreground one-shot position for the *current* location only.
  geolocator: ^14.0.3
  # Local persistence for saved reading snapshots (history).
  shared_preferences: ^2.5.3
  country_picker: ^2.0.28
  share_plus: ^13.3.0
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/zodiac/
    # The SIL OFL text for the bundled Noto and Cormorant families, registered
    # at startup so it shows up in the standard Flutter licence list.
    - assets/fonts/OFL-NotoSans.txt
    - assets/fonts/OFL-NotoSansCJK.txt
    - assets/fonts/OFL-CormorantGaramond.txt
    - assets/fonts/OFL-Montserrat.txt
    # Unicode CLDR supplies the Vietnamese, Thai and Hindi country names in
    # lib/data/country_names_data.dart; its licence ships with them.
    - assets/licenses/UNICODE-LICENSE.txt
  # Bundled so Vietnamese diacritics, Thai marks, Devanagari conjuncts, kana,
  # kanji and Simplified Chinese do not depend on what a device happens to
  # have installed. SIL Open Font License 1.1; the licences ship beside them.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Regular.ttf
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai-Regular.ttf
        - asset: assets/fonts/NotoSansThai-Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.otf
        - asset: assets/fonts/NotoSansJP-Bold.otf
          weight: 700
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
        - asset: assets/fonts/NotoSansSC-Bold.otf
          weight: 700
