name: decision_compass
description: Decision Compass vertical-slice mobile prototype.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  # Device IANA timezone id (not a DateTime.timeZoneName abbreviation).
  flutter_timezone: ^5.1.0
  # Foreground one-shot position for the *current* location only.
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/zodiac/
