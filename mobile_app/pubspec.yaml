name: decision_compass
description: AstraCue Cosmic Decisions vertical-slice mobile prototype.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  # Device IANA timezone id (not a DateTime.timeZoneName abbreviation).
  flutter_timezone: ^5.1.0
  # Foreground one-shot position for the *current* location only.
  geolocator: ^14.0.3
  # Local persistence for saved reading snapshots (history).
  shared_preferences: ^2.5.3
  country_picker: ^2.0.28
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/zodiac/
